name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Se elimina 'cache: npm' porque requiere package-lock.json

      - name: Install dependencies
        # Usamos 'npm install' en lugar de 'npm ci' para generar el lockfile al vuelo
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Si deseas configurar valores por defecto para el build, puedes hacerlo aquí
          # GITHUB_OWNER: facebook
          # GITHUB_REPO: react
          CI: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4